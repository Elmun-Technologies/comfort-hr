# fly.toml app configuration file generated for comfort-hr on 2026-08-26T06:05:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'comfort-hr'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Bu bot long polling ishlatadi (Telegram'ga o'zi tashqariga murojaat qiladi),
  # shuning uchun mashina DOIM yonib turishi shart. 'stop' bo'lsa Fly uni o'chiradi.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
